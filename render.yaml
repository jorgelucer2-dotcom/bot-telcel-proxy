services:
  - type: web
    name: bot-telcel-proxy-1
    env: node
    buildCommand: npm install && npx playwright install chromium
    startCommand: node index.js
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: BOT_TOKEN
        sync: false
      - key: ENLACE
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: ALLOWED_USERS
        sync: false
